<!doctype html>
<html lang="en" id="top">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome to nginx!</title>
    <style>
      body {
        margin: 0;
        font:
          1rem/1.5 system-ui,
          sans-serif;
        color: #162535;
        background: #eef4f8;
      }
      header {
        position: sticky;
        top: 0;
        padding: 0.75rem 1rem;
        background: #fff;
        border-bottom: 1px solid #bbc9d8;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1rem;
      }
      main {
        padding: 1rem;
        max-width: 56rem;
        margin: auto;
      }
      section {
        min-height: 60vh;
        margin: 1rem 0;
        padding: 1rem;
        box-sizing: border-box;
        border: 1px solid #bbc9d8;
        border-radius: 0.75rem;
        background: white;
      }
      #end {
        scroll-margin-top: 5rem;
      }
    </style>
  </head>
  <body>
    <header>
      <nav aria-label="Fixture navigation">
        <a href="#top">Back to top</a>
        <a href="#end">Jump to bottom</a>
      </nav>
    </header>
    <main>
      <h1>Welcome to nginx!</h1>
      <section>
        <h2>Desktop window</h2>
        <p>Resize the DSM window and confirm the content follows its width.</p>
      </section>
      <section>
        <h2>Nested scrolling</h2>
        <p>The app scrolls inside DSM; the desktop and wrapper should stay still.</p>
      </section>
      <section id="end">
        <h2>End of fixture</h2>
        <p>Use the pinned navigation to return to the top.</p>
      </section>
    </main>
  </body>
</html>
