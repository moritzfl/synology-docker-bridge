name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs the same checks before it publishes.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ["22", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm ci --prefix bridge --ignore-scripts
      - run: npm test
      - name: Validate example package configurations
        run: |
          node packaging/generate.mjs --check --config examples/nginx/app.json --arch x86_64
          node packaging/generate.mjs --check --config examples/nginx/app.json --arch armv8
